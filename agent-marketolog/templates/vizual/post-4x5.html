<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#FBF3EA;font-family:"Inter","Helvetica Neue",Arial,sans-serif;color:#3E4032}
.pad{padding:64px;height:100%;display:flex;flex-direction:column}
.serif{font-family:"Cormorant Garamond","Playfair Display",Georgia,serif}
.top{display:flex;justify-content:space-between;align-items:baseline;font-size:22px;letter-spacing:2px;text-transform:uppercase;color:#8A8578}
h1{font-size:64px;line-height:1.08;font-weight:500;margin:28px 0 24px}
.photo{width:952px;height:720px;object-fit:cover;border-radius:6px}
.row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:28px}
.price{font-size:46px;font-weight:600}
.note{font-size:22px;color:#8A8578;text-align:right;line-height:1.35}
.cta{margin-top:26px;display:inline-block;background:#8D9D76;color:#FBF3EA;font-size:24px;padding:18px 30px;border-radius:999px;align-self:flex-start}
.bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:21px;color:#5c5f4f}
.line{height:1px;background:#d9d3c6;width:100%;margin:22px 0 16px}
</style></head><body>
<div class="pad">
  <div class="top"><span>Silver Song Flowers</span><span>Санкт-Петербург</span></div>
  <h1 class="serif">Букет под ваш повод</h1>
  <img class="photo" src="../../results/avito-foto-v2/01.jpg">
  <div class="row">
    <div class="price">от 1 950 ₽</div>
    <div class="note">Авторский букет<br>фото до отправки</div>
  </div>
  <div class="line"></div>
  <div class="cta">Написать в сообщения →</div>
  <div class="bottom">
    <span>Белышева, 5/6 · Ленинский, 56 · Трибуца, 8</span>
    <span>@s_sflowers</span>
  </div>
</div>
</body></html>
